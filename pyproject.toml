[project]
name = "agent-factory"
version = "0.1.0"
description = "Фабрика агентов: LLM-инженер (Coder) + помощники создают новых CrewAI-агентов по запросу"
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.130.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "anthropic>=0.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_factory", "src/marketing_dept", "src/design_dept", "src/institute"]
