[project]
name = "agent-factory"
version = "0.2.0"
description = "SKYNET: мультиагентный ИИ-институт с роутингом, отделами, контролем качества и безопасным деплоем"
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools,litellm]>=0.130.0",
    "python-dotenv>=1.0.1",
    "python-telegram-bot>=21.0,<23.0",
    "pyyaml>=6.0.1",
    "anthropic>=0.40.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/agent_factory",
    "src/marketing_dept",
    "src/design_dept",
    "src/quality_control_dept",
    "src/institute",
]
