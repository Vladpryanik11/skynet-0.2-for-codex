analyze_references_task:
  description: >
    Пользователь запросил дизайн:

    "{user_request}"

    Вызови инструмент analyze_reference_images, чтобы разобрать все
    картинки из папки references/. Сопоставь результат с тем, что
    пользователь отметил как понравившееся в конкретных референсах
    (если в запросе есть нумерованные пометки вида "В №1 нравится...").
  expected_output: >
    Разбор каждого референса (типографика/сетка/палитра/ритм/пространство)
    плюс явная привязка к тому, что именно понравилось пользователю.
  agent: reference_analyst

design_system_task:
  description: >
    На основе разбора референсов и запроса пользователя собери ОДНУ
    согласованную дизайн-систему: типографическая шкала, сетка, палитра
    (с hex), отступы/ритм блоков, один сильный визуальный приём (из
    "Стиль:" в запросе). Сохрани файлом через save_design_file с
    filename="design-system.md" и project_name, коротко отражающим
    задачу пользователя.
  expected_output: >
    Текст дизайн-системы (тот же, что сохранён в файл) плюс путь к файлу.
  agent: design_system_architect
  context:
    - analyze_references_task

build_page_task:
  description: >
    По дизайн-системе и запросу пользователя собери ОДИН файл index.html
    с инлайн CSS (внутри <style> в <head>) — рабочую страницу с секциями,
    которые пользователь запросил (или предложи сам, если наполненность
    не указана явно). Соблюдай перечисленные в запросе ограничения
    (мало текста, много воздуха, каждая секция визуально отличается от
    предыдущей и т.п.). Если в запросе указано "Чего нет" (например:
    фото, цены, отзывы, цифры) — используй текстовые заглушки в
    квадратных скобках вместо этого, НЕ выдумывай факты. Сохрани через
    save_design_file с тем же project_name, filename="index.html".
  expected_output: >
    Полный HTML-код страницы (тот же, что сохранён в файл) плюс путь к файлу.
  agent: frontend_coder
  context:
    - design_system_task

review_design_task:
  description: >
    Сверь index.html с дизайн-системой и с ограничениями/списком "чего
    нет" из исходного запроса пользователя. Проверь, что секции визуально
    различаются, а не повторяют один паттерн, и что в тексте нет
    выдуманных фактов (цен/отзывов/цифр/фото, если они были в "чего нет").
    Если есть нарушения — перечисли их конкретно.
  expected_output: >
    Вердикт APPROVED или CHANGES_REQUESTED со списком конкретных замечаний.
  agent: design_reviewer
  context:
    - design_system_task
    - build_page_task

reflect_task:
  description: >
    Сначала вызови judge_final_output (исходный запрос "{user_request}" и
    готовую HTML-страницу) — это независимая оценка 1-5, а не твоё
    собственное мнение. Затем, с учётом разбора референсов, дизайн-системы,
    готовой страницы, вердикта ревью и оценки судьи, извлеки 1-3 конкретных
    урока, полезных для будущих похожих запросов на дизайн. Если оценка
    низкая — урок должен объяснять, что пошло не так. Для каждого урока
    вызови record_lesson. Если извлекать нечего — не вызывай инструмент и
    явно напиши "новых уроков нет".
  expected_output: >
    Оценка судьи, затем список сохранённых уроков (или "новых уроков нет").
  agent: learner
  context:
    - analyze_references_task
    - design_system_task
    - build_page_task
    - review_design_task
