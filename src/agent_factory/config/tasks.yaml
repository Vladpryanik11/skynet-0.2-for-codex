design_spec_task:
  description: >
    Пользователь хочет нового агента со следующим запросом:

    "{user_request}"

    Проверенные уроки предыдущих запусков отдела:
    {department_knowledge}

    Учитывай эти уроки, если они применимы к текущей задаче.

    Разложи это в спецификацию: role, goal, backstory, список нужных
    инструментов (встроенные crewai_tools или кастомные — опиши, что
    каждый должен делать), рекомендуемую модель (Claude или GPT и почему),
    критерии приёмки (когда считать агента готовым).
  expected_output: >
    Структурированная спецификация агента в Markdown с разделами:
    Role, Goal, Backstory, Tools, Recommended Model, Acceptance Criteria.
  agent: architect

research_task:
  description: >
    На основе спецификации найди/предложи актуальные (2026) готовые
    инструменты, MCP-серверы, промпт-паттерны и примеры кода, применимые
    к этой спецификации. Не ищи то, что не относится к спецификации.
  expected_output: >
    Список из 3-6 конкретных рекомендаций (инструмент/паттерн/пример) с
    кратким обоснованием, почему это подходит именно этому агенту.
  agent: researcher
  context:
    - design_spec_task

generate_agent_code_task:
  description: >
    Используя спецификацию Архитектора и находки Исследователя, напиши
    ПОЛНЫЙ рабочий Python-код нового агента на CrewAI: определение Agent,
    Task(и), Crew и точку входа kickoff(). Код должен запускаться сразу
    после `pip install crewai` и указания API-ключа в .env, без
    хардкода секретов. Комментарии — только там, где решение неочевидно.
  expected_output: >
    Один блок кода Python (весь файл целиком), готовый к сохранению как
    agent.py, плюс отдельно строка requirements, если нужны доп. пакеты.
  agent: coder
  context:
    - design_spec_task
    - research_task

review_code_task:
  description: >
    Проверь код от Кодера: 1) валиден ли Python-синтаксис, 2) соответствует
    ли спецификации Архитектора, 3) нет ли опасных операций (произвольный
    shell/eval, захардкоженные ключи), 4) осмысленны ли role/goal/backstory
    и промпты задач. Если есть проблемы — опиши их конкретно, с указанием
    строки/фрагмента и предложи исправление.
  expected_output: >
    Структурированный вердикт: verdict — "APPROVED" или "CHANGES_REQUESTED",
    issues — список конкретных замечаний (пустой список, если всё хорошо).
  agent: reviewer
  context:
    - design_spec_task
    - generate_agent_code_task

prepare_deploy_task:
  description: >
    Вызови инструмент deploy_generated_agent с именем файла, который Кодер
    сохранил через save_generated_agent, и придуманным image_tag (короткое
    осмысленное имя латиницей на основе задачи пользователя). Инструмент
    сам проверяет реальный вердикт ревью и откажет в деплое, если он не
    APPROVED — тебе не нужно и не нужно пытаться обойти эту проверку.
  expected_output: >
    Результат инструмента deploy_generated_agent как есть (успех с
    container_id либо сообщение о блокировке деплоя).
  agent: devops
  context:
    - review_code_task
    - generate_agent_code_task

reflect_task:
  description: >
    Сначала вызови judge_final_output (передай исходный запрос
    пользователя "{user_request}" и результат деплоя) — это независимая
    оценка 1-5, а не твоё собственное мнение. Затем, просмотрев весь ход
    выполнения (спецификация, исследование, код, вердикт ревью, результат
    деплоя) и оценку судьи, извлеки 1-3 конкретных урока. Если оценка
    низкая — урок должен объяснять, что пошло не так, а не задним числом
    хвалить результат. Для каждого урока вызови record_lesson. Если
    извлекать нечего — не вызывай инструмент и явно напиши "новых уроков
    нет".
  expected_output: >
    Оценка судьи, затем список сохранённых уроков (или "новых уроков нет").
  agent: learner
  context:
    - design_spec_task
    - research_task
    - generate_agent_code_task
    - review_code_task
    - prepare_deploy_task
