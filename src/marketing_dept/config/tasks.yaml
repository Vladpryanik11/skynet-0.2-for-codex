brief_task:
  description: >
    Пользователь запросил маркетинговый текст:

    "{user_request}"

    Составь бриф: целевая аудитория, УТП продукта/услуги (только из того,
    что есть в запросе — не выдумывай), тон коммуникации, канал публикации,
    ориентировочная длина текста, критерий успеха. Если в запросе не хватает
    данных — явно перечисли, какие предположения ты сделал вместо них.
  expected_output: >
    Бриф в Markdown с разделами: Аудитория, УТП, Тон, Канал, Длина,
    Критерий успеха, Предположения (если были).
  agent: strategist

draft_copy_task:
  description: >
    Напиши текст строго по брифу Стратега — с учётом канала, тона,
    длины и УТП. Не добавляй фактов о продукте, которых нет в брифе.
  expected_output: >
    Готовый черновик текста, оформленный под указанный в брифе канал
    (для соцсетей — с пометкой, где уместны хэштеги/эмодзи; для email —
    с темой письма; для лендинга — с разбивкой на блоки/заголовки).
  agent: copywriter
  context:
    - brief_task

seo_task:
  description: >
    Проверь бриф и черновик. Если канал из брифа поисковый (сайт/блог/
    лендинг) — предложи 3-7 ключевых слов, meta title (до 60 симв.) и
    meta description (до 160 симв.). Если канал НЕ поисковый — одной
    строкой напиши "SEO не применимо для канала: <канал>" и не делай
    больше ничего.
  expected_output: >
    Либо блок с ключевыми словами + meta title/description, либо строка
    о неприменимости SEO для данного канала.
  agent: seo_specialist
  context:
    - brief_task
    - draft_copy_task

edit_task:
  description: >
    Сверь черновик с брифом: аудитория/тон/УТП/длина соблюдены? Проверь
    грамматику и логику. Если есть расхождения — перечисли их конкретно
    и внеси правки сам. Собери финальную версию текста, готовую к
    публикации (включи одобренные SEO-рекомендации, если они были).
  expected_output: >
    Финальный текст, готовый к публикации, плюс короткий список правок,
    которые были внесены (или "правок не потребовалось").
  agent: editor
  context:
    - brief_task
    - draft_copy_task
    - seo_task

reflect_task:
  description: >
    Просмотри бриф, черновик, SEO-рекомендации и финальную правку.
    Извлеки 1-3 конкретных урока, полезных для будущих похожих запросов
    (например про формулировку брифа, частые правки редактора, удачные
    приёмы копирайтинга для этого канала). Для каждого урока вызови
    инструмент record_lesson. Если извлекать нечего — не вызывай
    инструмент и явно напиши "новых уроков нет".
  expected_output: >
    Список сохранённых уроков (или "новых уроков нет").
  agent: learner
  context:
    - brief_task
    - draft_copy_task
    - seo_task
    - edit_task
